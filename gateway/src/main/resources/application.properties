spring.application.name=gateway

# Route: book service
spring.cloud.gateway.routes[0].id=book
spring.cloud.gateway.routes[0].uri=http://localhost:8080
spring.cloud.gateway.routes[0].predicates[0]=Path=/available,/checked-out

# Route: account service
spring.cloud.gateway.routes[1].id=account
spring.cloud.gateway.routes[1].uri=http://localhost:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/accounts/**

# Route: customer service
spring.cloud.gateway.routes[2].id=customer
spring.cloud.gateway.routes[2].uri=http://localhost:8082
spring.cloud.gateway.routes[2].predicates[0]=Path=/customers/**

management.endpoints.web.exposure.include=health,info,gateway
