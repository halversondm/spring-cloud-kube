name: Docker Image CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Build Code
      run: mvn -e --batch-mode clean verify
    - name: SonarCloud Analysis
      if: env.SONAR_TOKEN != ''
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >
        mvn -e --batch-mode org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
        -Dsonar.projectKey=halversondm_spring-cloud-kube
        -Dsonar.organization=halversondm
        -Dsonar.host.url=https://sonarcloud.io
